name: skill-update

# Refresh the upstream docs mirror, re-derive the skill from it, run the agent pass over the prose and
# open a pull request with the result. The deterministic stages are documented in
# scripts/update_skill.py; the agent pass follows the prompt kit in prompts/skill-sync/ and is
# re-verified afterwards, so the run goes green only when the report lists no actions.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      agent_cmd:
        description: "Agent CLI prefix for the prose pass ('-' = deterministic stages only, empty = the workflow default)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: skill-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      # Default: opencode with a Zen free model, which needs no credentials today. Override with the
      # repository variable SKILL_AGENT_CMD — any agent CLI whose non-interactive prefix is stable.
      AGENT_CMD: ${{ inputs.agent_cmd || vars.SKILL_AGENT_CMD || 'opencode run --model opencode/big-pickle' }}
      BRANCH: skill-sync/upstream-docs
    steps:
      # No persisted credential: the agent runs with broad tool permissions in this checkout, so it
      # must not hold a push token. The pull-request step supplies its own token below.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install crawl4ai and its browsers
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          crawl4ai-setup

      - name: Install the agent CLI
        continue-on-error: true  # a CLI that will not install must not stop the deterministic stages
        run: |
          npm install -g opencode-ai@1.18.32   # pinned: run-mode flags and permission defaults move between releases
          opencode --version

      - name: Refresh the upstream docs mirror
        run: |
          python scripts/mirror_docs_site.py \
            --root https://docs.crawl4ai.com \
            --out docs/crawl4ai \
            --concurrency 6 \
            --json

      - name: Update the skill
        id: sync
        continue-on-error: true
        run: |
          if [ "$AGENT_CMD" = "-" ]; then AGENT_CMD=""; fi
          AGENT_BIN="${AGENT_CMD%% *}"
          if [ -n "$AGENT_CMD" ] && command -v "$AGENT_BIN" >/dev/null 2>&1; then
            python scripts/update_skill.py --probe --agent-cmd "$AGENT_CMD"
          else
            if [ -n "$AGENT_CMD" ]; then
              echo "::warning::agent CLI '$AGENT_BIN' is not installed; deterministic stages only"
            fi
            python scripts/update_skill.py --probe
          fi

      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "no changes: the skill matches the docs snapshot and the installed package"
            exit 0
          fi
          git config user.name "skill-sync[bot]"
          git config user.email "skill-sync[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A
          git commit -m "chore(skill): sync crawl4ai skill with the upstream docs snapshot"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch origin "$BRANCH" || true   # refresh the lease so the rolling branch can be updated
          git push --force-with-lease -u origin "$BRANCH"
          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            gh pr edit "$BRANCH" --title "chore(skill): sync with upstream docs" --body-file reports/skill-sync.md
          else
            gh pr create --base "$GITHUB_REF_NAME" --head "$BRANCH" \
              --title "chore(skill): sync with upstream docs" --body-file reports/skill-sync.md
          fi

      - name: Fail when the report still lists actions
        if: steps.sync.outcome == 'failure'
        run: |
          echo "::warning::the sync left actions for a maintainer or an agent; see reports/skill-sync.md"
          exit 1
