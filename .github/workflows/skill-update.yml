name: skill-update

# Keep the skill in step with the upstream documentation, unattended. The run probes GitHub for a
# change under docs/md_v2 (one API request, no installs), and stops there when the mirror and the
# skill's stamps already agree. Otherwise it mirrors the changed pages, re-derives the skill, runs the
# gates over the tree the agent pass left behind, and pushes to the branch. A run that cannot reach a
# green verdict pushes nothing and fails, so the next scheduled run retries from the same state
# instead of the pipeline advancing past work it did not do.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: "auto = probe and sync incrementally (a quiet tree ends the run); full = refetch every page; agent = also force the prose pass; deterministic = skip the agent pass. full and agent always run the pipeline"
        type: choice
        options:
          - auto
          - full
          - agent
          - deterministic
        default: auto

permissions:
  contents: write # the run pushes to the branch it was triggered on

concurrency:
  group: skill-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      # Default: opencode 2 with a free Zen model. The free models answer with no credentials, so the
      # step needs no secret; `{model}` is replaced per attempt from scripts/agent-models.json, and
      # SKILL_AGENT_CMD (a repository variable) replaces the command outright — name a paid model
      # there and add its key to this step's env as a secret.
      #   --standalone  a private server: the shared background service can time out in a fresh
      #                 container ("Timed out waiting for the background service to start")
      #   --auto        auto-approve permissions that are not explicitly denied; without it an `ask`
      #                 (external directory, .env) has no client to answer it in a non-interactive run
      AGENT_CMD: ${{ vars.SKILL_AGENT_CMD || 'opencode run --standalone --auto --model {model}' }}
      MODE: ${{ inputs.mode || 'auto' }}
    steps:
      # No persisted credential: the agent runs with broad tool permissions in this checkout, so it
      # must not hold a push token. The credential is installed only for the initial pull and the push.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Setup only: the interpreter is needed by the probe, and the probe itself needs no packages.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Probe upstream
        id: probe
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code=0
          python scripts/sync_docs_repo.py --check --json > probe.json || code=$?
          cat probe.json
          # `auto` and `deterministic` stop here on a quiet tree; `full` and `agent` are an explicit
          # request to run the pipeline, so the probe result cannot skip them.
          needed="true"
          if [ "$MODE" = "auto" ] || [ "$MODE" = "deterministic" ]; then
            case "$code" in
              0) needed="false" ;;
              3) needed="true" ;;
              *) echo "::error::the upstream probe failed"; exit "$code" ;;
            esac
          fi
          echo "needed=$needed" >> "$GITHUB_OUTPUT"

      - name: Report a quiet tree
        if: steps.probe.outputs.needed == 'false'
        run: |
          echo "Crawl4AI is already synchronized." >> "$GITHUB_STEP_SUMMARY"
          echo "the upstream commit and the skill's stamps agree; nothing was downloaded and no model was called"

      - name: Install the pipeline's dependencies
        if: steps.probe.outputs.needed == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          crawl4ai-setup   # the probe stage crawls example.com for real

      - name: Install the agent CLI
        if: steps.probe.outputs.needed == 'true' && env.MODE != 'deterministic'
        continue-on-error: true # a CLI that will not install must not stop the deterministic stages
        run: |
          # OpenCode 2: @opencode/cli ships the native binary (docs: https://opencode.ai/v2/docs/).
          # Pinned: `run` flags and permission defaults move between releases.
          npm install -g @opencode/cli@2.0.18
          opencode --version

      - name: Mirror the upstream documentation
        if: steps.probe.outputs.needed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "$MODE" = "full" ]; then
            python scripts/sync_docs_repo.py --json --full
          else
            python scripts/sync_docs_repo.py --json
          fi

      - name: Update the skill
        id: sync
        if: steps.probe.outputs.needed == 'true'
        continue-on-error: true # the report is uploaded below even when the verdict is red
        run: |
          set -uo pipefail
          args=(--probe)
          if [ "$MODE" = "agent" ]; then
            args+=(--force-agent)   # a maintainer asking for a prose pass on a quiet tree
          fi
          if [ "$MODE" != "deterministic" ]; then
            agent_bin="${AGENT_CMD%% *}"
            if command -v "$agent_bin" >/dev/null 2>&1; then
              args+=(--agent-cmd "$AGENT_CMD" --models-file scripts/agent-models.json)
            else
              echo "::warning::agent CLI '$agent_bin' is not installed; the prose pass is skipped"
            fi
          fi
          python scripts/update_skill.py "${args[@]}"

      - name: Verify before pushing
        # A push made with GITHUB_TOKEN does not trigger skill-check (GitHub suppresses workflow runs
        # for its own token), so the checks that gate a pull request run here too, before the commit.
        if: steps.probe.outputs.needed == 'true' && steps.sync.outcome == 'success'
        run: |
          set -euo pipefail
          python -m skills_ref.cli validate .agents/skills/crawl4ai
          python -B scripts/sync_docs_repo.py --verify

      - name: Commit and push
        if: steps.probe.outputs.needed == 'true' && steps.sync.outcome == 'success'
        run: |
          set -euo pipefail
          git config user.name "skill-sync[bot]"
          git config user.email "skill-sync[bot]@users.noreply.github.com"
          # Only what the pipeline owns: an unrelated change in the tree is never swept in.
          git add -A -- docs/crawl4ai reports/skill-sync.md .agents/skills/crawl4ai scripts prompts \
            .style_check.py requirements.txt README.md
          if git diff --cached --quiet; then
            echo "the pipeline found nothing to commit"
            exit 0
          fi
          git commit -m "chore(skill): sync crawl4ai skill with upstream docs"
          git remote set-url origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: skill-sync-report
          path: reports/skill-sync.md
          if-no-files-found: ignore

      - name: Fail when the pipeline left actions
        if: steps.sync.outcome == 'failure'
        run: |
          echo "::error::the sync did not reach a green verdict; reports/skill-sync.md lists the actions it left"
          exit 1
