name: skill-check

# Offline gates. No browsers and no network: every step either introspects the installed package or
# reads files, so a pull request — or the push the update workflow just made — gets an answer in
# seconds. The same gates run inside scripts/update_skill.py before anything is committed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the package under test
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: API drift gate
        run: python -B .agents/skills/crawl4ai/scripts/check_api.py

      - name: Style gate
        run: python -B .style_check.py .agents/skills/crawl4ai

      - name: Lint gate
        # The rule families in ruff.toml; `docs/` is excluded there, so the upstream Markdown of the
        # mirror is not linted as if it were this project's code.
        run: python -m ruff check .

      - name: Agent Skills specification
        # The reference validator for the published spec: front matter, name, directory match,
        # description length. Pinned in requirements.txt; pip installs its console script as
        # `agentskills`, and `python -m skills_ref.cli` is the version-independent form.
        run: python -m skills_ref.cli validate .agents/skills/crawl4ai

      - name: Mirror, manifest and skill stamps agree
        run: python -B scripts/sync_docs_repo.py --verify

      - name: Skill matches the committed docs snapshot
        run: python -B scripts/update_skill.py --check-only
